version: "2"
linters:
  default: none
  enable:
    - dupl
    - godot
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  settings:
    dupl:
      threshold: 400
    staticcheck:
      # v1 ran only the SA (staticcheck) and S (gosimple) checks.
      checks:
        - all
        - -ST*
        - -QF*
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - gen
      - vendor
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: lax
    paths:
      - gen
      - vendor
      - third_party$
      - builtin$
      - examples$
